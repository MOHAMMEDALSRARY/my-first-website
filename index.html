<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الإلكتروني الأول</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 10px #cccccc;
        }

        h1 {
            color: #2563eb;
        }

        p {
            font-size: 18px;
            color: #333333;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>مرحبًا بك في موقعي! 👋</h1>

        <p>هذا أول موقع إلكتروني لي.</p>

        <p>أنا أتعلم تصميم المواقع باستخدام HTML وCSS.</p>

        <button onclick="alert('أهلًا بك في موقعي!')">
            اضغط هنا
        </button>
    </div>
</body>
</html>
